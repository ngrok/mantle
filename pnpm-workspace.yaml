packages:
  - "apps/*"
  - "config/*"
  - "packages/*"

# Don't install packages that are less than 6h old
# This reduces the risk of installing compromised packages.
# In most cases, malicious releases are discovered and removed from the registry
# within an hour.
# see: https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 360

minimumReleaseAgeExclude:
  - "@ngrok/remark-mdx-github-alerts"
  - "@ngrok/remark-mdx-no-paragraph-wrap"
  - "@types/react"
  - "@types/react-dom"
  - "react"
  - "react-dom"
  - "typescript"

# Don't let pnpm switch itself to package.json#packageManager or record its own
# version in pnpm-lock.yaml. mise and pnpm/action-setup already pin the version.
# With the default (download), pnpm 12 writes a second YAML document into the
# lockfile, and single-document readers (the Vercel CLI, the GitHub dependency
# graph) stop parsing it. see: pnpm/pnpm#13805
pmOnFail: ignore

catalog:
  "@phosphor-icons/react": "2.1.10"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@tailwindcss/oxide": "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  "@testing-library/dom": "10.4.2"
  "@testing-library/jest-dom": "7.0.1"
  "@testing-library/react": "16.3.3"
  "@testing-library/user-event": "14.6.8"
  "@tsdown/css": "0.23.1"
  "@types/node": "24.19.2"
  "@vitest/browser-playwright": "5.0.5"
  "happy-dom": "21.0.4"
  "oxc-parser": "0.155.0"
  "oxc-transform-react": "0.155.0"
  "oxfmt": "0.74.0"
  "playwright-core": "1.64.1"
  "playwright": "1.64.1"
  "react-dom": "19.3.1"
  "react": "19.3.1"
  "tailwindcss": "4.3.3"
  "tsdown": "0.23.1"
  "tsx": "4.23.15"
  "typescript": "7.0.2"
  "vite": "8.3.4"

overrides:
  "@types/node": "catalog:"
  "ajv": ">=8.20.0"
  "cookie": ">=1.1.1"
  "esbuild": ">=0.28.2"
  # Clears GHSA-7p8r-x3mc-p8w7, GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, and GHSA-5jgf-p345-68v8 (fast-uri host confusion and
  # SSRF). Capped to the major its only consumer declares: ajv wants fast-uri ^3.
  "fast-uri": ">=3.1.6 <4"
  # Clears GHSA-698v-4r3x-3vcv, GHSA-587h-7wmj-h5pm, and GHSA-r825-w8mm-5pxw
  # (launch-editor command execution and Windows escaping). Capped to the major its only consumer declares:
  # @changesets/cli wants launch-editor ^2.
  "launch-editor": ">=2.14.2 <3"
  # Clears GHSA-jxfw-x594-9x9m (morgan log forging). Capped to the major its
  # only consumer declares: @react-router/serve wants morgan ^1.
  "morgan": ">=1.12.0 <2"
  "playwright": "catalog:"
  "playwright-core": "catalog:"
  # Clears GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx (qs DoS and array-limit
  # bypass). Capped to the major its consumers declare: express and body-parser
  # want qs ^6.
  "qs": ">=6.16.0 <7"
  "uuid": ">=14.0.2"
    
allowBuilds:
  "@ast-grep/cli": true
  "esbuild": true
  "@tailwindcss/oxide": true

# Why no agent skills: the repo hand-writes its agent guidance, so a skill a
# dependency ships stays out of the install.
permissions:
  "@tanstack/react-table":
    skills: false
