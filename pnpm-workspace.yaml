packages:
  - "apps/*"
  - "config/*"
  - "packages/*"

# Don't install packages that are less than 6h old
# This reduces the risk of installing compromised packages.
# In most cases, malicious releases are discovered and removed from the registry
# within an hour.
# see: https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 360

minimumReleaseAgeExclude:
  - "@ngrok/remark-mdx-github-alerts"
  - "@ngrok/remark-mdx-no-paragraph-wrap"
  - "@types/react"
  - "@types/react-dom"
  - "react"
  - "react-dom"
  - "typescript"

catalog:
  "@phosphor-icons/react": "2.1.10"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  "@tailwindcss/vite": "4.3.3"
  "@testing-library/dom": "10.4.1"
  "@testing-library/jest-dom": "7.0.1"
  "@testing-library/react": "16.3.3"
  "@testing-library/user-event": "14.6.6"
  "@tsdown/css": "0.22.14"
  "@types/node": "24.13.3"
  "@vitest/browser-playwright": "4.1.11"
  "happy-dom": "20.12.0"
  "oxc-parser": "0.147.0"
  "playwright-core": "1.62.1"
  "playwright": "1.62.1"
  "react-dom": "19.2.8"
  "react": "19.2.8"
  "tailwindcss": "4.3.3"
  "tsdown": "0.22.14"
  "tsx": "4.23.13"
  "typescript": "7.0.2"
  "vite": "8.2.2"

overrides:
  "@types/node": "catalog:"
  "@mjackson/node-fetch-server": "npm:@remix-run/node-fetch-server@0.10.0"
  "ajv": ">=8.20.0"
  "cookie": ">=1.1.1"
  "esbuild": ">=0.28.2"
  # Clears GHSA-7p8r-x3mc-p8w7 (fast-uri host confusion). Capped to the major
  # its only consumer declares: ajv wants fast-uri ^3.
  "fast-uri": ">=3.1.5 <4"
  "playwright": "catalog:"
  "playwright-core": "catalog:"
  "uuid": ">=14.0.2"
    
allowBuilds:
  "esbuild": true
  "@tailwindcss/oxide": true
