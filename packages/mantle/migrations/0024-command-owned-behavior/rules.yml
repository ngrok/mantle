# `Command` no longer renders cmdk's `cmdk-*` attributes. Each part carries a
# `data-slot`, so an attribute selector in a class string or a CSS-in-JS string
# moves to that slot. The rule rewrites only files that import
# `@ngrok/mantle/command`, so a file that uses cmdk itself keeps its selectors.
id: command-cmdk-attribute-to-data-slot
language: tsx
message: "`cmdk-*` attributes are gone: select the part's `data-slot`"
rule:
  all:
    - kind: string_fragment
    - regex: \[cmdk-(root|input|list|group|group-heading|group-items|item|separator|empty)\]
    - pattern: $FRAGMENT
    - inside:
        kind: program
        stopBy: end
        has:
          kind: import_statement
          has:
            field: source
            regex: ^["']@ngrok/mantle/command["']$
transform:
  SELECTOR:
    replace:
      source: $FRAGMENT
      replace: \[cmdk-(?<part>root|input|list|group-heading|group-items|group|item|separator|empty)\]
      by: "[data-slot~=command-$part]"
fix: $SELECTOR
