id: action-column-null-header
language: tsx
message: the action column needs a sticky header even when it has no label
utils:
  datatable-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/data-table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^DataTable$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $DT
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $DT
  table-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Table$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $TABLE
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $TABLE
  action-cell-name:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $DT
      - has:
          field: property
          regex: ^ActionCell$
  # The nearest object literal is the column, and it holds an action cell.
  action-column:
    kind: object
    has:
      stopBy: end
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        matches: action-cell-name
  # The nearest property is the column's `header`, so a table a `cell` renders
  # keeps its own headers.
  header-property:
    kind: pair
    has:
      field: key
      regex: ^header$
rule:
  pattern:
    context: "({ header: () => null })"
    selector: pair
  all:
    - inside:
        stopBy:
          kind: object
        matches: action-column
    - inside:
        stopBy: end
        kind: program
        has:
          matches: datatable-import
fix: "header: () => <$DT.ActionHeader />"
