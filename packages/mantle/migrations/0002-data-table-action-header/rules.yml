# Every rule binds $DT to the local name of the `DataTable` import from
# `@ngrok/mantle/data-table` (and $TABLE to `Table`), so an aliased import
# matches and another library's `Table` does not.
id: action-column-header
language: tsx
message: the action column header becomes DataTable.ActionHeader
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  datatable-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/data-table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^DataTable$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $DT
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $DT
  table-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Table$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $TABLE
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $TABLE
  action-cell-name:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $DT
      - has:
          field: property
          regex: ^ActionCell$
  # The nearest object literal is the column, and it holds an action cell. The
  # search stops at a nested object, so a column whose cell renders a table
  # with its own action column keeps its header.
  action-column:
    kind: object
    has:
      stopBy:
        kind: object
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        matches: action-cell-name
  # The nearest property is the column's `header`, so a table a `cell` renders
  # keeps its own headers.
  header-property:
    kind: pair
    has:
      field: key
      regex: ^header$
rule:
  any:
    - pattern: <$DT.Header $$$ATTRS>$$$CHILDREN</$DT.Header>
    - pattern: <$TABLE.Header $$$ATTRS>$$$CHILDREN</$TABLE.Header>
      inside:
        stopBy: end
        kind: program
        has:
          matches: table-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      not:
        inside:
          stopBy: end
          matches: scope
          has:
            stopBy:
              matches: scope
            any:
              - matches: binding-name
                pattern: $TABLE
              - matches: function-declaration
                has:
                  field: name
                  pattern: $TABLE
  all:
    - inside:
        stopBy:
          kind: pair
        matches: header-property
    - inside:
        stopBy:
          kind: object
        matches: action-column
    - inside:
        stopBy: end
        kind: program
        has:
          matches: datatable-import
    # Why: a parameter or a local under the import's name shadows it, and the
    # rules cannot tell which binding the element reads.
    - not:
        inside:
          stopBy: end
          matches: scope
          has:
            stopBy:
              matches: scope
            any:
              - matches: binding-name
                pattern: $DT
              - matches: function-declaration
                has:
                  field: name
                  pattern: $DT
fix: <$DT.ActionHeader $$$ATTRS>$$$CHILDREN</$DT.ActionHeader>
