                stopBy:
                  matches: scope
                any:
                  - matches: binding-name
                    pattern: $COMBOBOX
                  - matches: function-declaration
                    has:
                      field: name
                      pattern: $COMBOBOX
rule:
  kind: property_identifier
  regex: ^selectedValue$
  inside:
    kind: jsx_attribute
    inside:
      matches: combobox-root
fix: value
