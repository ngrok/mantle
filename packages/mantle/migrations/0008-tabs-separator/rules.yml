# Every rule binds $TABS to the local name of the `Tabs` import from
# `@ngrok/mantle/tabs`, so an aliased import matches and another library's
# `Tabs` does not. The nearest `Tabs.Root` decides whether a list is classic.
id: tabs-list-add-separator
language: tsx
message: a classic Tabs.List needs Tabs.Separator after it
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  tabs-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/tabs["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Tabs$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $TABS
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $TABS
  tabs-list-name:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $TABS
      - has:
          field: property
          regex: ^List$
  tabs-separator:
    kind: jsx_self_closing_element
    has:
      field: name
      kind: member_expression
      all:
        - has:
            field: object
            pattern: $TABS
        - has:
            field: property
            regex: ^Separator$
  tabs-root:
    kind: jsx_element
    has:
      field: open_tag
      has:
        field: name
        kind: member_expression
        all:
          - has:
              field: object
              pattern: $TABS
          - has:
              field: property
              regex: ^Root$
  pill-root:
    matches: tabs-root
    has:
      field: open_tag
      has:
        kind: jsx_attribute
        has:
          kind: property_identifier
          regex: ^appearance$
        any:
          - kind: jsx_attribute
            has:
              kind: string
              regex: ^["']pill["']$
          - kind: jsx_attribute
            has:
              kind: jsx_expression
              has:
                kind: string
                regex: ^["']pill["']$
  appearance-attribute:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^appearance$
  # A root with no appearance, or a literal appearance other than pill. A
  # dynamic appearance stays manual, because a separator shows on pill tabs.
  classic-root:
    matches: tabs-root
    not:
      matches: pill-root
    any:
      - not:
          has:
            field: open_tag
            has:
              matches: appearance-attribute
      - has:
          field: open_tag
          has:
            matches: appearance-attribute
            any:
              - kind: jsx_attribute
                has:
                  kind: string
              - kind: jsx_attribute
                has:
                  kind: jsx_expression
                  has:
                    kind: string
  # A list that already has its separator, with or without a condition.
  separator-follows:
    kind: jsx_element
    precedes:
      any:
        - matches: tabs-separator
        - kind: jsx_expression
          has:
            stopBy: end
            matches: tabs-separator
  hide-border:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^hideBorder$
  # A list that a rule can give a sibling: it sits in a file that imports
  # `Tabs`, its parent is an element (a fragment is one too, while the
  # `{show && <Tabs.List />}` shape has no enclosing tag), and the nearest
  # `Tabs.Root` is classic.
  list-that-takes-separator:
    kind: jsx_element
    all:
      - has:
          field: open_tag
          has:
            field: name
            matches: tabs-list-name
      - inside:
          stopBy: end
          kind: program
          has:
            matches: tabs-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $TABS
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $TABS
      - inside:
          kind: jsx_element
      - inside:
          stopBy:
            matches: tabs-root
          matches: classic-root
rule:
  kind: jsx_closing_element
  inside:
    matches: list-that-takes-separator
    all:
      - not:
          has:
            field: open_tag
            has:
              matches: hide-border
      - not:
          matches: separator-follows
fix: |-
  </$TABS.List>
  <$TABS.Separator />
