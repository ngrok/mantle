# Every rule binds $TABS to the local name of the `Tabs` import from
# `@ngrok/mantle/tabs`, so an aliased import matches and another library's
# `Tabs` does not. The nearest `Tabs.Root` decides whether a list is classic.
id: tabs-list-add-separator
language: tsx
message: a classic Tabs.List needs Tabs.Separator after it
utils:
  tabs-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/tabs["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Tabs$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $TABS
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $TABS
  tabs-list-name:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $TABS
      - has:
          field: property
          regex: ^List$
  tabs-separator:
    kind: jsx_self_closing_element
    has:
      field: name
      kind: member_expression
      all:
        - has:
            field: object
            pattern: $TABS
        - has:
            field: property
            regex: ^Separator$
  tabs-root:
    kind: jsx_element
    has:
      field: open_tag
      has:
        field: name
        kind: member_expression
        all:
          - has:
              field: object
              pattern: $TABS
          - has:
              field: property
              regex: ^Root$
  pill-root:
    matches: tabs-root
    has:
      field: open_tag
      has:
        kind: jsx_attribute
        has:
          kind: property_identifier
          regex: ^appearance$
        any:
          - kind: jsx_attribute
            has:
              kind: string
              regex: ^["']pill["']$
          - kind: jsx_attribute
            has:
              kind: jsx_expression
              has:
                kind: string
                regex: ^["']pill["']$
  classic-root:
    matches: tabs-root
    not:
      matches: pill-root
  hide-border:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^hideBorder$
  # A list that a rule can give a sibling: it sits in a file that imports
  # `Tabs`, its parent is an element (a fragment is one too, while the
  # `{show && <Tabs.List />}` shape has no enclosing tag), and the nearest
  # `Tabs.Root` is classic.
  list-that-takes-separator:
    kind: jsx_element
    all:
      - has:
          field: open_tag
          has:
            field: name
            matches: tabs-list-name
      - inside:
          stopBy: end
          kind: program
          has:
            matches: tabs-import
      - inside:
          kind: jsx_element
      - inside:
          stopBy:
            matches: tabs-root
          matches: classic-root
rule:
  kind: jsx_closing_element
  inside:
    matches: list-that-takes-separator
    all:
      - not:
          has:
            field: open_tag
            has:
              matches: hide-border
      - not:
          precedes:
            any:
              - matches: tabs-separator
              - kind: jsx_expression
                has:
                  stopBy: end
                  matches: tabs-separator
fix: |-
  </$TABS.List>
  <$TABS.Separator />
