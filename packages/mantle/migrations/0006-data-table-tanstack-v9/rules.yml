# Every rule runs only in a file that imports from `@ngrok/mantle/data-table`,
# and the TypeScript copies reach a `.ts` module that holds column definitions.
id: column-sorting-fn
language: tsx
message: a column's sortingFn option is sortFn in TanStack Table v9
utils:
  data-table-import:
    kind: import_statement
    has:
      field: source
      regex: ^["']@ngrok/mantle/data-table["']$
  in-data-table-file:
    kind: program
    has:
      matches: data-table-import
rule:
  pattern:
    context: "({ sortingFn: $VALUE })"
    selector: pair
  inside:
    stopBy: end
    matches: in-data-table-file
fix: "sortFn: $VALUE"
---
id: table-get-state
language: tsx
message: table.getState() is the table.state property in TanStack Table v9
utils:
  data-table-import:
    kind: import_statement
    has:
      field: source
      regex: ^["']@ngrok/mantle/data-table["']$
  in-data-table-file:
    kind: program
    has:
      matches: data-table-import
  # The instance a `useTable` call returns, under whatever name it is bound to.
  table-binding:
    kind: variable_declarator
    all:
      - has:
          field: name
          pattern: $TABLE
      - has:
          field: value
          pattern: $HOOK($$$)
rule:
  pattern: $TABLE.getState()
  inside:
    stopBy: end
    matches: in-data-table-file
  # Why three shapes: a column callback receives the instance as `table`, and
  # a prop carries it under a name that ends in `table`, with no declaration
  # in the file to bind to. The dry run is the check on that last one.
  any:
    - pattern: table.getState()
    - pattern: $TABLE.getState()
      has:
        field: function
        has:
          field: object
          regex: (?i)table$
    - pattern: $TABLE.getState()
      inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          matches: table-binding
constraints:
  HOOK:
    regex: ^useTable$
fix: $TABLE.state
