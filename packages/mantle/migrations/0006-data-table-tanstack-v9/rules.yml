# Every rule runs only in a file that imports from `@ngrok/mantle/data-table`,
# and the TypeScript copies reach a `.ts` module that holds column definitions.
id: column-sorting-fn
language: tsx
message: a column's sortingFn option is sortFn in TanStack Table v9
utils:
  data-table-import:
    kind: import_statement
    has:
      field: source
      regex: ^["']@ngrok/mantle/data-table["']$
  in-data-table-file:
    kind: program
    has:
      matches: data-table-import
  # A column helper call: `columnHelper.accessor(…)`, `.display(…)`, or
  # `.group(…)`.
  column-helper-call:
    kind: call_expression
    has:
      field: function
      kind: member_expression
      has:
        field: property
        regex: ^(accessor|display|group)$
  # An object literal that is a column definition: the options of a column
  # helper call, an element of a `columns` array, or an object with a column
  # key. Row data with a `sortingFn` field is none of these.
  column-options:
    kind: object
    any:
      - inside:
          kind: arguments
          inside:
            matches: column-helper-call
      - inside:
          kind: array
          any:
            - inside:
                kind: arguments
                inside:
                  kind: call_expression
                  has:
                    field: function
                    kind: member_expression
                    has:
                      field: property
                      regex: ^columns$
            - inside:
                kind: pair
                has:
                  field: key
                  regex: ^columns$
      - has:
          kind: pair
          has:
            field: key
            regex: ^(accessorKey|accessorFn|header|cell)$
rule:
  pattern:
    context: "({ sortingFn: $VALUE })"
    selector: pair
  all:
    - inside:
        matches: column-options
    - inside:
        stopBy: end
        matches: in-data-table-file
fix: "sortFn: $VALUE"
---
id: table-get-state
language: tsx
message: table.getState() is the table.state property in TanStack Table v9
utils:
  data-table-import:
    kind: import_statement
    has:
      field: source
      regex: ^["']@ngrok/mantle/data-table["']$
  in-data-table-file:
    kind: program
    has:
      matches: data-table-import
  # A node that opens a lexical scope. The binding searches below stop at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  scope-or-program:
    any:
      - matches: scope
      - kind: program
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  # The instance a `useTable` call returns, under whatever name it is bound to.
  table-binding:
    kind: variable_declarator
    all:
      - has:
          field: name
          pattern: $TABLE
      - has:
          field: value
          pattern: useTable($$$)
  # A variable under the table's name whose value is not a `useTable` call:
  # a store, a state machine, or any other object with a `getState` method.
  other-declarator:
    kind: variable_declarator
    has:
      field: name
      pattern: $TABLE
    not:
      matches: table-binding
  # The nearest enclosing scope that declares the table with `useTable`.
  table-scope:
    matches: scope-or-program
    has:
      stopBy:
        matches: scope
      matches: table-binding
rule:
  pattern: $TABLE.getState()
  inside:
    stopBy: end
    matches: in-data-table-file
  # Why three shapes: a column callback receives the instance as `table`, and
  # a prop carries it under a name that ends in `table`, with no declaration
  # in the file to bind to. The dry run is the check on that last one.
  any:
    - pattern: table.getState()
      not:
        inside:
          stopBy: end
          matches: scope-or-program
          has:
            stopBy:
              matches: scope
            matches: other-declarator
    - pattern: $TABLE.getState()
      has:
        field: function
        has:
          field: object
          regex: (?i)table$
      not:
        inside:
          stopBy: end
          matches: scope-or-program
          has:
            stopBy:
              matches: scope
            matches: other-declarator
    - pattern: $TABLE.getState()
      inside:
        stopBy: end
        matches: table-scope
      # Why: a parameter or a local under the table's name, between the read
      # and the `useTable` call, shadows the table.
      not:
        inside:
          stopBy:
            matches: table-scope
          matches: scope-or-program
          has:
            stopBy:
              matches: scope
            any:
              - matches: binding-name
                pattern: $TABLE
                not:
                  inside:
                    matches: table-binding
              - matches: function-declaration
                has:
                  field: name
                  pattern: $TABLE
fix: $TABLE.state
