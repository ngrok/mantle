# Every rule binds the local name of each part's import from its
# `@ngrok/mantle/<subpath>`, so an aliased import matches and another
# library's `Button` does not.
id: priority-default-to-accent
language: tsx
message: Button priority="default" becomes intent="accent"
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  alertdialog-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/alert-dialog["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^AlertDialog$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $ALERT_DIALOG
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $ALERT_DIALOG
  button-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/button["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Button$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $BUTTON
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $BUTTON
  datatable-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/data-table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^DataTable$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $DT
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $DT
  button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: identifier
          pattern: $BUTTON
      - inside:
          stopBy: end
          kind: program
          has:
            matches: button-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $BUTTON
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $BUTTON
  alert-dialog-action-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $ALERT_DIALOG
            - has:
                field: property
                regex: ^Action$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: alertdialog-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $ALERT_DIALOG
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $ALERT_DIALOG
  alert-dialog-cancel-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $ALERT_DIALOG
            - has:
                field: property
                regex: ^Cancel$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: alertdialog-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $ALERT_DIALOG
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $ALERT_DIALOG
  header-sort-button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $DT
            - has:
                field: property
                regex: ^HeaderSortButton$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: datatable-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $DT
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $DT
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^priority$
  any:
    - kind: jsx_attribute
      has:
        kind: string
        regex: ^["']default["']$
    - kind: jsx_attribute
      has:
        kind: jsx_expression
        has:
          kind: string
          regex: ^["']default["']$
  inside:
    any:
      - matches: button-element
      - matches: alert-dialog-action-element
      - matches: alert-dialog-cancel-element
      - matches: header-sort-button-element
fix: intent="accent"
