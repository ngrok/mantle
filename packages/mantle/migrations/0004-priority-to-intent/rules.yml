# Every rule binds the local name of each part's import from its
# `@ngrok/mantle/<subpath>`, so an aliased import matches and another
# library's `Button` does not.
id: priority-default-to-accent
language: tsx
message: Button priority="default" becomes intent="accent"
utils:
  alert-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/alert["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Alert$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $ALERT
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $ALERT
  alertdialog-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/alert-dialog["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^AlertDialog$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $ALERT_DIALOG
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $ALERT_DIALOG
  button-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/button["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Button$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $BUTTON
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $BUTTON
  datatable-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/data-table["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^DataTable$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $DT
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $DT
  iconbutton-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/button["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^IconButton$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $ICON_BUTTON
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $ICON_BUTTON
  toast-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/toast["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Toast$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $TOAST
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $TOAST
  button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
