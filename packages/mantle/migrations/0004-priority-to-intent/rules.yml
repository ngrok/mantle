          all:
            - has:
                field: object
                pattern: $ALERT_DIALOG
            - has:
                field: property
                regex: ^Root$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: alertdialog-import
  alert-dialog-action-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $ALERT_DIALOG
            - has:
                field: property
                regex: ^Action$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: alertdialog-import
  alert-dialog-cancel-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $ALERT_DIALOG
            - has:
                field: property
                regex: ^Cancel$
