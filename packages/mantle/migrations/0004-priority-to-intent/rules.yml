id: button-bare
language: tsx
message: a bare Button keeps its old implicit outlined accent rendering
utils:
  button-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/button["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
