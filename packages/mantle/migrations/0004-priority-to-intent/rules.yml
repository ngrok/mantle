      - has:
          field: name
          kind: identifier
          pattern: $ICON_BUTTON
      - inside:
          stopBy: end
          kind: program
          has:
            matches: iconbutton-import
  alert-root-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $ALERT
            - has:
                field: property
                regex: ^Root$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: alert-import
  alert-dialog-root-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
