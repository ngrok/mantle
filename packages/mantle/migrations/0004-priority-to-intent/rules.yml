id: priority-default-to-accent
language: tsx
message: Button priority="default" becomes intent="accent"
rule:
  kind: jsx_attribute
  regex: ^priority="default"$
  inside:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
    has:
      field: name
      regex: ^(Button|AlertDialog\.Action|DataTable\.HeaderSortButton)$
fix: intent="accent"
---
id: priority-to-intent
language: tsx
message: rename priority to intent
rule:
  kind: jsx_attribute
  pattern: $ATTR
  regex: ^priority\b
  not:
    regex: ^priority="default"$
  inside:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
    has:
      field: name
      regex: ^(Button|IconButton|Alert\.Root|AlertDialog\.Root|AlertDialog\.Action|AlertDialog\.Cancel|Toast\.Root|DataTable\.HeaderSortButton)$
transform:
  RENAMED:
    replace:
      source: $ATTR
      replace: ^priority
      by: intent
fix: $RENAMED
---
id: button-bare
language: tsx
message: a bare Button keeps its old implicit outlined accent rendering
utils:
  element:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
  has-appearance:
    has:
      kind: jsx_attribute
      regex: ^appearance\b
  has-tone:
    has:
      kind: jsx_attribute
      regex: ^(priority|intent)\b
rule:
  kind: identifier
  regex: ^Button$
  inside:
    matches: element
    all:
      - not:
          matches: has-appearance
      - not:
          matches: has-tone
fix: Button appearance="outlined" intent="accent"
