          stopBy: end
          kind: program
          has:
            matches: alertdialog-import
  toast-root-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $TOAST
            - has:
                field: property
                regex: ^Root$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: toast-import
  header-sort-button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $DT
            - has:
                field: property
                regex: ^HeaderSortButton$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: datatable-import
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^priority$
  any:
    - kind: jsx_attribute
      has:
        kind: string
        regex: ^["']default["']$
    - kind: jsx_attribute
      has:
        kind: jsx_expression
        has:
          kind: string
          regex: ^["']default["']$
  inside:
    any:
      - matches: button-element
      - matches: alert-dialog-action-element
      - matches: header-sort-button-element
fix: intent="accent"
