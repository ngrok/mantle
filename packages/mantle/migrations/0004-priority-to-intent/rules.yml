            - kind: import_specifier
              has:
                field: alias
                pattern: $BUTTON
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $BUTTON
  iconbutton-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/button["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^IconButton$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $ICON_BUTTON
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $ICON_BUTTON
  button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: identifier
          pattern: $BUTTON
      - inside:
          stopBy: end
          kind: program
          has:
            matches: button-import
  icon-button-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    # Why all: the name binds the metavariable, and the import must read it.
    all:
      - has:
          field: name
          kind: identifier
          pattern: $ICON_BUTTON
      - inside:
          stopBy: end
          kind: program
          has:
            matches: iconbutton-import
  has-tone:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^(priority|intent)$
  has-appearance:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^appearance$
  appearance-filled:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^appearance$
    any:
      - kind: jsx_attribute
        has:
          kind: string
          regex: ^["']filled["']$
      - kind: jsx_attribute
        has:
          kind: jsx_expression
          has:
            kind: string
            regex: ^["']filled["']$
  # A static appearance other than filled. A dynamic one stays manual, because
  # the old implicit intent depended on the value.
  appearance-static-not-filled:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^appearance$
    any:
      - kind: jsx_attribute
        has:
          kind: string
      - kind: jsx_attribute
        has:
          kind: jsx_expression
          has:
            kind: string
    not:
      matches: appearance-filled
rule:
  kind: identifier
  pattern: $BUTTON
  inside:
    matches: button-element
    all:
      - not:
          has:
            matches: has-appearance
      - not:
          has:
            matches: has-tone
fix: $BUTTON appearance="outlined" intent="accent"
