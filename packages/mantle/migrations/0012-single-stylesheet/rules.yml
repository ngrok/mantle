                            - matches: block-scope
                              has:
                                stopBy:
                                  matches: function-scope
                                matches: binding-name
                                pattern: $URLS
                                inside:
                                  stopBy: end
                                  matches: var-declaration
      # Why one declarator: a deletion would take its siblings with it.
      - not:
          has:
            kind: variable_declarator
            follows: { stopBy: end, kind: variable_declarator }
      # Why: a name that other code still reads keeps its declaration.
      - not:
          inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              any:
                - kind: identifier
                - kind: shorthand_property_identifier
              pattern: $DECL
              not:
                any:
                  - inside: { kind: variable_declarator, field: name }
rule:
  kind: import_specifier
  all:
    - has:
        field: name
        regex: ^(MantleStyleSheets|mantleStyleSheetUrls|MantleStyleSheetsProps|MantleThemeCssUrls)$
    - any:
        - has:
            field: alias
            pattern: $LOCAL
        - all:
            - not:
                has:
                  field: alias
                  kind: identifier
            - has:
                field: name
                pattern: $LOCAL
    - inside:
        stopBy: end
        kind: import_statement
        has:
          field: source
          regex: ^["']@ngrok/mantle/theme["']$
    # Why a sibling that stays: removing the last specifier leaves an empty
    # import. The statement rule deletes that one whole.
    - inside:
        kind: named_imports
        has:
          kind: import_specifier
          not:
            has:
              field: name
              regex: ^(MantleStyleSheets|mantleStyleSheetUrls|MantleStyleSheetsProps|MantleThemeCssUrls)$
    # Why: deleting a binding that other code still reads leaves an undefined
    # name. That code stays, and the type checker names the manual work.
    - not:
        inside:
          stopBy: end
          kind: program
          has:
            stopBy: end
            any:
              - kind: identifier
              - kind: shorthand_property_identifier
              - kind: type_identifier
            pattern: $LOCAL
            not:
              any:
                - inside: { stopBy: end, kind: import_statement }
                - inside: { stopBy: end, matches: deleted-declaration }
fix:
  template: ""
  expandEnd: { regex: "^,$" }
---
id: mantle-style-sheets-import-statement
language: typescript
message: MantleStyleSheets and mantleStyleSheetUrls are gone
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
          - inside: { kind: for_in_statement, field: left }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  # A scope that a `var` leaves: the `var` binds in the enclosing function.
  block-scope:
    any:
      - kind: statement_block
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  function-scope:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
  var-declaration:
    any:
      - kind: variable_declaration
      - kind: for_in_statement
        regex: ^for\s*(await\s*)?\(\s*var\b
  style-sheet-urls-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/theme["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^mantleStyleSheetUrls$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $URLS
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $URLS
  # A `const` the declaration rule deletes: not exported, one declarator, a
  # call to mantle's `mantleStyleSheetUrls` as its value, and a name that only
  # a deleted `<MantleStyleSheets />` reads.
  deleted-declaration:
    kind: lexical_declaration
    not:
      inside: { kind: export_statement }
    all:
      - has:
          kind: variable_declarator
          all:
            - has: { field: name, kind: identifier, pattern: $DECL }
            - has:
                field: value
                kind: call_expression
                all:
                  - has: { field: function, kind: identifier, pattern: $URLS }
                  - inside:
                      stopBy: end
                      kind: program
                      has:
                        matches: style-sheet-urls-import
                  # Why: a parameter or a local under the import's name shadows it, and the
                  # rules cannot tell which binding the code reads.
                  - not:
                      inside:
                        stopBy: end
                        matches: scope
                        has:
                          stopBy:
                            matches: scope
                          any:
                            - matches: binding-name
                              pattern: $URLS
                            - matches: function-declaration
                              has:
                                field: name
                                pattern: $URLS
                            # Why: a `var` in a nested block binds in the enclosing function.
                            - matches: block-scope
                              has:
                                stopBy:
                                  matches: function-scope
                                matches: binding-name
                                pattern: $URLS
                                inside:
                                  stopBy: end
                                  matches: var-declaration
      # Why one declarator: a deletion would take its siblings with it.
      - not:
          has:
            kind: variable_declarator
            follows: { stopBy: end, kind: variable_declarator }
      # Why: a name that other code still reads keeps its declaration.
      - not:
          inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              any:
                - kind: identifier
                - kind: shorthand_property_identifier
              pattern: $DECL
              not:
                any:
                  - inside: { kind: variable_declarator, field: name }
rule:
  kind: import_statement
  all:
    - has:
        field: source
        regex: ^["']@ngrok/mantle/theme["']$
    - not:
        has: { kind: import_clause, has: { kind: identifier } }
    - has:
        stopBy: end
        kind: named_imports
        not:
          has:
            kind: import_specifier
            not:
              has:
                field: name
                regex: ^(MantleStyleSheets|mantleStyleSheetUrls|MantleStyleSheetsProps|MantleThemeCssUrls)$
    # Why: deleting a binding that other code still reads leaves an undefined
    # name. That import stays, and the type checker names the manual work.
    - not:
        has:
          stopBy: end
          kind: import_specifier
          all:
            - any:
                - has:
                    field: alias
                    pattern: $LOCAL
                - all:
                    - not:
                        has:
                          field: alias
                          kind: identifier
                    - has:
                        field: name
                        pattern: $LOCAL
            - inside:
                stopBy: end
                kind: program
                has:
                  stopBy: end
                  any:
                    - kind: identifier
                    - kind: shorthand_property_identifier
                    - kind: type_identifier
                  pattern: $LOCAL
                  not:
                    any:
                      - inside: { stopBy: end, kind: import_statement }
                      - inside: { stopBy: end, matches: deleted-declaration }
fix: ""
