    # rules cannot tell which binding the code reads.
    - not:
        inside:
          stopBy: end
          matches: scope
          has:
            stopBy:
              matches: scope
            any:
              - matches: binding-name
                pattern: $SHEETS
              - matches: function-declaration
                has:
                  field: name
                  pattern: $SHEETS
