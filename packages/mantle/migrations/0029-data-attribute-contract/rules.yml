# Rewrites what a codemod can place for the mantle data attribute contract:
# the class variants mantle.css no longer registers, and test assertions on
# data-state open/closed/expanded/collapsed. Read the migration guide for the
# steps that stay manual.
id: class-variant-radix
language: tsx
message: mantle.css has no data-state-* variants; the bracket form keeps matching Radix's own data-state
utils:
  # A file that imports Radix renders Radix's own `data-state` values, so its
  # classes keep matching them through the bracket form.
  radix-file:
    inside:
      stopBy: end
      kind: program
      has:
        kind: import_statement
        has:
          field: source
          regex: ^["']@radix-ui/
  # A class on an element that sets its own `data-state`, such as an app's own
  # component. Mantle did not write that value, so the class keeps matching it
  # through the bracket form.
  own-state-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          kind: jsx_attribute
          has:
            kind: property_identifier
            regex: ^data-state$
  # A class on a part whose name ends in `Trigger`: the trigger now carries
  # `aria-expanded`, not `data-state`.
  trigger-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: Trigger$
  # A class on a Select item, which carries `aria-selected`, not `aria-checked`.
  select-item-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: Select\.Item$
  # A class on a menu checkbox item, which marks indeterminate with `aria-checked="mixed"`.
  checkbox-item-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: CheckboxItem$
  # A class on a tab list, which carries `aria-orientation`, not `data-orientation`.
  tab-list-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: Tabs\.List$
  # A class inside a trigger's children, where a `group-` variant reads the trigger.
  trigger-child-class:
    inside:
      stopBy: end
      kind: jsx_element
      has:
        field: open_tag
        kind: jsx_opening_element
        has:
          field: name
          regex: Trigger$
rule:
  kind: string_fragment
  regex: '\bdata-(state-(open|closed|checked|unchecked|active|inactive|selected|indeterminate|idle|pending|submitting)|side-(top|right|bottom|left)|orientation-(horizontal|vertical)|validation-(success|warning|error)|active-item)(/[\w-]+)?:'
  pattern: $F
  any:
    - matches: radix-file
    - matches: own-state-class
transform:
  T1:
    replace:
      source: $F
      replace: '\bdata-state-([a-z]+)(/[\w-]+)?:'
      by: "data-[state~=${1}]${2}:"
  T2:
    replace:
      source: $T1
      replace: '\bdata-(side|orientation|validation)-([a-z]+)(/[\w-]+)?:'
      by: "data-[${1}=${2}]${3}:"
  T3:
    replace:
      source: $T2
      replace: '\bdata-active-item(/[\w-]+)?:'
      by: "data-highlighted${1}:"
fix: $T3
