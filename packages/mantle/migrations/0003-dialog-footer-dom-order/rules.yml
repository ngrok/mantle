# The rule binds $DIALOG to the local name of the `Dialog` import from
# `@ngrok/mantle/dialog`, so an aliased import matches and another library's
# `Dialog` does not.
id: dialog-footer-swap-two
language: tsx
message: swap the two children of Dialog.Footer
utils:
  dialog-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/dialog["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Dialog$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $DIALOG
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $DIALOG
  child:
    any:
      - kind: jsx_element
      - kind: jsx_self_closing_element
      - kind: jsx_expression
rule:
  pattern: <$DIALOG.Footer $$$ATTRS>$$$CHILDREN</$DIALOG.Footer>
  all:
    - inside:
        stopBy: end
        kind: program
        has:
          matches: dialog-import
    - has:
        pattern: $FIRST
        nthChild:
          position: 1
          ofRule:
            matches: child
    - has:
        pattern: $SECOND
        nthChild:
          position: 2
          ofRule:
            matches: child
    - not:
        has:
          nthChild:
            position: 3
            ofRule:
              matches: child
    # Why: the fix writes the two elements back and nothing else, so a footer
    # with its own text between them would lose it.
    - not:
        has:
          kind: jsx_text
          regex: \S
fix: |-
  <$DIALOG.Footer $$$ATTRS>
  	$SECOND
  	$FIRST
  </$DIALOG.Footer>
