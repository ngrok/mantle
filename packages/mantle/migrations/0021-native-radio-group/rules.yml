# Radio items render a `<label>` around a native radio, so they take no `as`.
# Values are strings, so the roots take no `by`. The roots report the value with
# `onValueChange`, and `onChange` is the DOM event again. Each rule binds the local name
# of the `@ngrok/mantle/<subpath>` import, so an aliased import matches and
# another library's `RadioGroup` does not.
id: radio-drop-as-and-by
language: tsx
message: radio items take no `as`, and radio roots take no `by`
utils:
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  radiogroup-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/radio-group["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^RadioGroup$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $RADIO
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $RADIO
  segmented-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/segmented-control["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^SegmentedControl$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $SEGMENTED
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $SEGMENTED
  # The `RADIO.<Part>` name of a JSX element, when `RADIO` is the mantle import
  # and no local binding shadows it.
  radiogroup-part:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $RADIO
      - inside:
          stopBy: end
          kind: program
          has:
            matches: radiogroup-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rule cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $RADIO
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $RADIO
  # The `SEGMENTED.<Part>` name of a JSX element, when `SEGMENTED` is the mantle import
  # and no local binding shadows it.
  segmented-part:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $SEGMENTED
      - inside:
          stopBy: end
          kind: program
          has:
            matches: segmented-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rule cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $SEGMENTED
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $SEGMENTED
rule:
  kind: jsx_attribute
  any:
    - all:
        - has:
            kind: property_identifier
            regex: ^as$
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              all:
                - has:
                    field: property
                    regex: ^(Item|ListItem|Card)$
                - matches: radiogroup-part
    - all:
        - has:
            kind: property_identifier
            regex: ^by$
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              all:
                - has:
                    field: property
                    regex: ^(Root|List)$
                - matches: radiogroup-part
    - all:
        - has:
            kind: property_identifier
            regex: ^as$
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              all:
                - has:
                    field: property
                    regex: ^(Item)$
                - matches: segmented-part
    - all:
        - has:
            kind: property_identifier
            regex: ^by$
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              all:
                - has:
                    field: property
                    regex: ^(Root)$
                - matches: segmented-part
fix: ""
