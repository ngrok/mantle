              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $SHEETS
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^(lightHighContrastCssUrl|darkHighContrastCssUrl|forceTheme|ssrCookie|nonce)$
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    all:
      - has:
          field: name
