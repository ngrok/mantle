  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  mantle-style-sheets-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/theme["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^MantleStyleSheets$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $SHEETS
