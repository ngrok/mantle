# Every rule binds $QUERY to the local name of the `Query` import from
# `@ngrok/mantle/query`, so an aliased import matches and another library's
# `Query` does not.
id: query-input-shortcut-wrap-self-closing
language: tsx
message: Query.Input no longer takes keyboardShortcut; wrap it in FocusShortcut
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  query-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/query["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Query$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $QUERY
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $QUERY
  query-input-name:
    kind: member_expression
    all:
      - has:
          field: object
          pattern: $QUERY
      - has:
          field: property
          regex: ^Input$
  # Any `keyboardShortcut` attribute.
  shortcut-attribute:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^keyboardShortcut$
  # `keyboardShortcut` or `keyboardShortcut={true}`: the shortcut is on.
  shortcut-on:
    matches: shortcut-attribute
    any:
      - not:
          has:
            kind: jsx_expression
      - has:
          kind: jsx_expression
          has:
            kind: "true"
  # The element reads the `Query` that `@ngrok/mantle/query` exports, not a
  # local binding that shadows it.
  mantle-query-input:
    all:
      - has:
          field: name
          matches: query-input-name
      - inside:
          stopBy: end
          kind: program
          has:
            matches: query-import
      # Why: a parameter or a local under the import's name shadows it, and the
      # rules cannot tell which binding the element reads.
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $QUERY
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $QUERY
  # A `FocusShortcut` name that does not come from `@ngrok/mantle/focus-shortcut`.
  # The wrapper would read that binding, so the file stays for a manual edit.
  foreign-focus-shortcut:
    any:
      - kind: identifier
      - kind: type_identifier
      - kind: shorthand_property_identifier_pattern
    regex: ^FocusShortcut$
    not:
      any:
        - inside: { kind: member_expression, field: object }
        - inside:
            stopBy: end
            kind: import_statement
            has:
              field: source
              regex: ^["']@ngrok/mantle/focus-shortcut["']$
  # An opening or self-closing tag that the wrap rules rewrite.
  shortcut-tag:
    all:
      - has:
          matches: shortcut-on
      - matches: mantle-query-input
      # Why: a key must move to the new outer element, a spread can set
      # `children` or turn the shortcut off, and a `children` prop loses to
      # the hint as a JSX child.
      - not:
          has:
            any:
              - kind: jsx_expression
                has:
                  kind: spread_element
              - kind: jsx_attribute
                has:
                  kind: property_identifier
                  regex: ^(?:key|children)$
      # Why: the attribute rewrite must touch only this tag, so JSX inside a
      # prop that also sets `keyboardShortcut` stays for a manual edit.
      - not:
          has:
            kind: jsx_attribute
            has:
              stopBy: end
              matches: shortcut-attribute
      - not:
          inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              matches: foreign-focus-shortcut
  # Why: `Slot`, `Field.Control`, and an `asChild` part pass their ref and
  # props to their one child, and `FocusShortcut.Root` renders no element to
  # take them. A ternary or `&&` inside such a part counts too.
  slotted:
    inside:
      stopBy:
        kind: jsx_element
      kind: jsx_element
      has:
        field: open_tag
        any:
          - has:
              field: name
              regex: (?:^|\.)(?:Slot|Control)$
          - has:
              kind: jsx_attribute
              has:
                kind: property_identifier
                regex: ^asChild$
  # Why: ast-grep indents each line of the wrapped tag, which would change
  # the text of a multi-line string.
  multi-line-string:
    any:
      - kind: string
      - kind: template_string
    regex: \n
  wrappable-self-closing:
    kind: jsx_self_closing_element
    all:
      - matches: shortcut-tag
      - not:
          matches: slotted
      - not:
          has:
            stopBy: end
            matches: multi-line-string
  wrappable-element:
    kind: jsx_element
    all:
      - has:
          field: open_tag
          matches: shortcut-tag
      # Why: the hint beside text or an expression would leave text bare beside
      # an element, which a translated page cannot update. Elements only.
      - not:
          has:
            any:
              - kind: jsx_expression
              - kind: jsx_text
                regex: \S
      - not:
          matches: slotted
      - not:
          has:
            stopBy: end
            matches: multi-line-string
rule:
  matches: wrappable-self-closing
  pattern: $SOURCE
rewriters:
  # Removes the attribute through the syntax tree, so a string or a comment
  # that names `keyboardShortcut` stays as it is. The wrap rules skip a tag
  # with `keyboardShortcut` inside a prop, so only the tag's own attribute goes.
  - id: drop-shortcut
    rule:
      matches: shortcut-attribute
    fix: ""
transform:
  WITHOUT:
    rewrite:
      rewriters: [drop-shortcut]
      source: $SOURCE
  OPEN:
    replace:
      source: $WITHOUT
      replace: '\s*/>$'
      by: "\n>"
fix: |-
  <FocusShortcut.Root>
    <FocusShortcut.Field>
      $OPEN
        <FocusShortcut.Hint />
      </$QUERY.Input>
    </FocusShortcut.Field>
  </FocusShortcut.Root>

