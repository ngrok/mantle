    # Why: a string compared with `===` chooses a class; it is not one.
    - not:
        inside:
          kind: string
          inside:
            any:
              - pattern: $A === $B
              - pattern: $A !== $B
              - pattern: $A == $B
              - pattern: $A != $B
transform:
  T1:
    replace:
      source: $F
      replace: '(^|[\s:])(-?)space-y-'
      by: "${1}between:${2}mbe-"
  T2:
    replace:
      source: $T1
      replace: '(^|[\s:])(-?)space-x-'
      by: "${1}between:${2}me-"
  T3:
    replace:
      source: $T2
      replace: '(^|[\s:])divide-y\b'
      by: "${1}between:border-b"
  T4:
    replace:
      source: $T3
      replace: '(^|[\s:])divide-x\b'
      by: "${1}between:border-e"
  T5:
    replace:
      source: $T4
      replace: '(^|[\s:])divide-'
      by: "${1}between:border-"
fix: $T5
---
id: space-divide-to-between-sidebar
language: tsx
message: Sidebar spaces or divides its children with `between:`; write the override with `between:` so `cx` replaces it
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  ns-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/sidebar["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^Sidebar$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $NS
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $NS
  # The opening tag of an affected part, in a file that imports the namespace,
  # where no parameter or local shadows the import's name.
  part-tag:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    all:
      - has:
          field: name
          kind: member_expression
          all:
            - has:
                field: object
                pattern: $NS
            - has:
                field: property
                regex: ^(Body|List)$
      - inside:
          stopBy: end
          kind: program
          has:
            matches: ns-import
      - not:
          inside:
            stopBy: end
            matches: scope
            has:
              stopBy:
                matches: scope
              any:
                - matches: binding-name
                  pattern: $NS
                - matches: function-declaration
                  has:
                    field: name
                    pattern: $NS
  as-child:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^asChild$
  # The className of the part, or of the one element that an `asChild` part
  # renders, because Slot merges that element's classes after the part's.
  part-class:
    inside:
      stopBy: end
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
      inside:
        any:
          - matches: part-tag
          - all:
              - any:
                  - kind: jsx_opening_element
                  - kind: jsx_self_closing_element
              - any:
                  - inside:
                      kind: jsx_element
                      has:
                        field: open_tag
                        matches: part-tag
                        has:
                          matches: as-child
                  - inside:
                      kind: jsx_element
                      inside:
                        kind: jsx_element
                        has:
                          field: open_tag
                          matches: part-tag
                          has:
                            matches: as-child
rule:
  kind: string_fragment
  regex: '(^|[\s:])-?(space-[xy]-|divide-)'
  pattern: $F
  all:
    - matches: part-class
    # Why: a reverse utility has no `between:` form; it stays manual.
    - not:
        regex: "(space|divide)-[xy]-reverse"
    # Why: a colon inside an arbitrary variant is not a variant boundary.
    - not:
        regex: '(space-[xy]-|divide-)[^\s]*\]'
    # Why: a string compared with `===` chooses a class; it is not one.
    - not:
        inside:
          kind: string
          inside:
            any:
              - pattern: $A === $B
              - pattern: $A !== $B
              - pattern: $A == $B
              - pattern: $A != $B
transform:
  T1:
    replace:
      source: $F
      replace: '(^|[\s:])(-?)space-y-'
      by: "${1}between:${2}mbe-"
  T2:
    replace:
      source: $T1
      replace: '(^|[\s:])(-?)space-x-'
      by: "${1}between:${2}me-"
  T3:
    replace:
      source: $T2
      replace: '(^|[\s:])divide-y\b'
      by: "${1}between:border-b"
  T4:
    replace:
      source: $T3
      replace: '(^|[\s:])divide-x\b'
      by: "${1}between:border-e"
  T5:
    replace:
      source: $T4
      replace: '(^|[\s:])divide-'
      by: "${1}between:border-"
fix: $T5
