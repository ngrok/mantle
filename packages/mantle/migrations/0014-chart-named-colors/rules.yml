          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  linechart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/line-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^LineChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $LINE
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $LINE
  barchart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/bar-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^BarChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $BAR
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $BAR
  areachart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/area-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^AreaChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $AREA
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $AREA
  scatterplot-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/scatter-plot["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^ScatterPlot$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $SCATTER
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $SCATTER
  # A series part of a chart family: Line, Bar, Area, or Point on the name
  # the family's import binds.
  series-part:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      kind: member_expression
      any:
        - all:
            - has:
                field: object
                pattern: $LINE
            - has:
                field: property
                regex: ^Line$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: linechart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $LINE
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $LINE
        - all:
            - has:
                field: object
                pattern: $BAR
            - has:
                field: property
                regex: ^Bar$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: barchart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $BAR
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $BAR
        - all:
            - has:
                field: object
                pattern: $AREA
            - has:
                field: property
                regex: ^Area$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: areachart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $AREA
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $AREA
        - all:
            - has:
                field: object
                pattern: $SCATTER
            - has:
                field: property
                regex: ^Point$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: scatterplot-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $SCATTER
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $SCATTER
  # The `color` attribute of a series part.
  series-color:
    kind: jsx_attribute
    has:
      kind: property_identifier
      regex: ^color$
    inside:
      matches: series-part
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^seriesSlot$
  all:
    - any:
        - has:
            kind: string
            has:
              kind: string_fragment
              regex: ^other$
        - has:
            kind: jsx_expression
            has:
              kind: string
              has:
                kind: string_fragment
                regex: ^other$
    - inside:
        matches: series-part
        not:
          has:
            matches: series-color
fix: color="neutral"
---
id: chart-token-in-string-tsx
language: tsx
message: the chart tokens take color names, so --color-chart-1 and bg-chart-1 become --color-chart-blue and bg-chart-blue
rule:
  kind: string_fragment
  regex: '(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-(?:[1-8]|other)\b'
  pattern: $V
transform:
  T1:
    replace:
      source: $V
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)1\b'
      by: "${p}blue"
  T2:
    replace:
      source: $T1
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)2\b'
      by: "${p}emerald"
  T3:
    replace:
      source: $T2
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)3\b'
      by: "${p}pink"
  T4:
    replace:
      source: $T3
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)4\b'
      by: "${p}orange"
  T5:
    replace:
      source: $T4
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)5\b'
      by: "${p}teal"
  T6:
    replace:
      source: $T5
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)6\b'
      by: "${p}fuchsia"
  T7:
    replace:
      source: $T6
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)7\b'
      by: "${p}violet"
  T8:
    replace:
      source: $T7
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)8\b'
      by: "${p}amber"
  T9:
    replace:
      source: $T8
      replace: '(?P<p>(?:--color-|bg-|text-|fill-|stroke-|border-|ring-|outline-|from-|via-|to-|decoration-|shadow-|accent-|caret-)chart-)other\b'
      by: "${p}neutral"
fix: $T9
