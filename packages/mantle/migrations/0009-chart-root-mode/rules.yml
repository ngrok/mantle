      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^ScatterPlot$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $SCATTER
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $SCATTER
  chart-root:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      kind: member_expression
      any:
        - all:
            - has:
                field: object
                pattern: $LINE
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: linechart-import
        - all:
            - has:
                field: object
                pattern: $BAR
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: barchart-import
        - all:
            - has:
                field: object
                pattern: $AREA
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: areachart-import
        - all:
            - has:
                field: object
                pattern: $SCATTER
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: scatterplot-import
rule:
  kind: jsx_attribute
  pattern:
    context: <Root decorative={$FLAG} />
    selector: jsx_attribute
  inside:
    matches: chart-root
# Why a kind list: a ternary needs parentheses as the test of another ternary,
# and so do `??`, `as`, and `await`. The formatter strips them from the rest.
constraints:
  FLAG:
    not:
      any:
        - kind: ternary_expression
        - kind: as_expression
        - kind: satisfies_expression
        - kind: assignment_expression
        - kind: augmented_assignment_expression
        - kind: await_expression
        - kind: sequence_expression
        - kind: arrow_function
        - kind: function_expression
        - kind: yield_expression
        - kind: "true"
        - kind: binary_expression
          regex: \?\?
fix: 'mode={$FLAG ? "decorative" : "interactive"}'
