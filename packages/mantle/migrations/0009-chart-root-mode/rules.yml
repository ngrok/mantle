# Every rule binds the local name of a chart Root's import from its
# `@ngrok/mantle/<chart>` subpath, so an aliased import matches and another
# library's `decorative` prop does not.
id: chart-decorative-flag
language: tsx
message: the chart Roots take mode="decorative" in place of the decorative flag
utils:
  # A node that opens a lexical scope. The shadow search below stops at a
  # nested one, so a sibling function's local name does not count.
  scope:
    any:
      - kind: statement_block
      - kind: function_declaration
      - kind: generator_function_declaration
      - kind: function_expression
      - kind: generator_function
      - kind: arrow_function
      - kind: method_definition
      - kind: class_body
      - kind: for_statement
      - kind: for_in_statement
      - kind: catch_clause
  # An identifier in a binding position: a parameter, a destructured name, a
  # local variable, a function name, or a class name.
  binding-name:
    any:
      - kind: shorthand_property_identifier_pattern
      - kind: identifier
        any:
          - inside: { kind: variable_declarator, field: name }
          - inside: { kind: function_declaration, field: name }
          - inside: { kind: generator_function_declaration, field: name }
          - inside: { kind: function_expression, field: name }
          - inside: { kind: required_parameter, field: pattern }
          - inside: { kind: optional_parameter, field: pattern }
          - inside: { kind: assignment_pattern, field: left }
          - inside: { kind: pair_pattern, field: value }
          - inside: { kind: array_pattern }
          - inside: { kind: rest_pattern }
          - inside: { kind: arrow_function, field: parameter }
          - inside: { kind: catch_clause, field: parameter }
      - kind: type_identifier
        inside: { kind: class_declaration, field: name }
  # A function declaration opens a scope, so the search above stops at it and
  # never reads its name. This matches the declaration itself instead.
  function-declaration:
    any:
      - kind: function_declaration
      - kind: generator_function_declaration
  linechart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/line-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^LineChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $LINE
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $LINE
  barchart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/bar-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^BarChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $BAR
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $BAR
  areachart-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/area-chart["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^AreaChart$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $AREA
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $AREA
  scatterplot-import:
    kind: import_statement
    all:
      - has:
          field: source
          regex: ^["']@ngrok/mantle/scatter-plot["']$
      - has:
          stopBy: end
          kind: import_specifier
          has:
            field: name
            regex: ^ScatterPlot$
          any:
            - kind: import_specifier
              has:
                field: alias
                pattern: $SCATTER
            - kind: import_specifier
              not:
                has:
                  field: alias
                  kind: identifier
              has:
                field: name
                pattern: $SCATTER
  chart-root:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      kind: member_expression
      any:
        - all:
            - has:
                field: object
                pattern: $LINE
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: linechart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $LINE
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $LINE
        - all:
            - has:
                field: object
                pattern: $BAR
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: barchart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $BAR
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $BAR
        - all:
            - has:
                field: object
                pattern: $AREA
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: areachart-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $AREA
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $AREA
        - all:
            - has:
                field: object
                pattern: $SCATTER
            - has:
                field: property
                regex: ^Root$
            - inside:
                stopBy: end
                kind: program
                has:
                  matches: scatterplot-import
            # Why: a parameter or a local under the import's name shadows it, and the
            # rules cannot tell which binding the element reads.
            - not:
                inside:
                  stopBy: end
                  matches: scope
                  has:
                    stopBy:
                      matches: scope
                    any:
                      - matches: binding-name
                        pattern: $SCATTER
                      - matches: function-declaration
                        has:
                          field: name
                          pattern: $SCATTER
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^decorative$
  any:
    - kind: jsx_attribute
      not:
        has:
          kind: jsx_expression
    - kind: jsx_attribute
      has:
        kind: jsx_expression
        has:
          kind: "true"
  inside:
    matches: chart-root
fix: mode="decorative"
