name: GitHub Actions

on:
  pull_request:
  push:
    branches:
      - main
      - "gh-readonly-queue/**"

concurrency:
  group: actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-lock:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock 📦
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify .github/workflows/actions.lock is complete and current 🔒
        run: gh actions-lock --verify --fail-on-warning
