# ngrok-ship: pipeline-updates disabled
#
# The line above turns off ngrok ship pipeline updates for this file. Ship opens
# no pull request to rewrite it, so the change check and the actions.lock pins
# stay. Remove the line to let ship manage the file again.
#
# ngrok/ship-action builds the image and reports it to ship. A pull request
# gets a preview only when the action runs. The step runs only when the docs
# site's turbo build inputs changed since the last successful run, or when
# this workflow changed. A push that changes only tests or files outside the
# docs site's dependency graph keeps the running preview. A push to `main` deploys the `main` environment the same way.
#
# A draft pull request gets no preview, because previews share one compute
# pool. A conversion to draft cancels a running deploy. When the PR is marked
# ready for review, the check compares it with its base, the same as when it
# opens.

# Do not start the name with "Build and Push Container". Ship reads a run with
# that name at this path as a run of its old workflow, and looks for an image
# artifact that this workflow does not upload.
name: "ngrok ship (ngrok-mantle / app_3FsBBr2ai9ocPOzjWWaBDBf9Pna)"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # A manual run skips the change check and deploys the branch.
  workflow_dispatch:

concurrency:
  # A second push to the same ref makes the in-flight image obsolete before it lands.
  # Manual runs get their own group, so a push does not cancel a redeploy.
  group: ship-mantle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # .github/actions/ship-build-changed reads earlier runs of this workflow.
  actions: read
  contents: read
  # The action authenticates to ship with a GitHub OIDC token.
  id-token: write

jobs:
  build:
    # A pull request from a fork gets no OIDC token, so the action cannot run for it.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft
      )
    runs-on: ubuntu-latest
    steps:
      # The default ref is the merge of the PR into its base, which ship expects.
      # Depth 2 holds the base and the PR head, the merge commit's parents.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Check whether @app/www needs a new image
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: $/.github/actions/ship-build-changed
        with:
          package: "@app/www"

      - name: Read the Node version from .nvmrc
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # .github/actions/ship-build-changed reads this step name.
      - name: Build and deploy with ngrok ship
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: ngrok/ship-action@v1.0.0
        with:
          app-id: "app_3FsBBr2ai9ocPOzjWWaBDBf9Pna"
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
