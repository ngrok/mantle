name: Vibe Check

on:
  # Run on PRs (one run per PR; superseded pushes auto-cancel) and on the branches
  # that actually gate a merge: `main` (post-merge validation + warms the turbo
  # remote cache for PRs) and the merge-queue refs. Plain feature-branch pushes no
  # longer trigger the full matrix on their own — open a PR to get CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "gh-readonly-queue/**"
  workflow_dispatch:

concurrency:
  # On pull_request, github.ref is refs/pull/<n>/merge (shared shape across PRs), so
  # key on the PR number; fall back to the ref for push/dispatch. Never cancel main so
  # a post-merge run always completes.
  group: vibe-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # The CI token writes only through the ci host. TURBO_API overrides `remoteCache.apiUrl` in turbo.json.
  TURBO_API: https://turborepo-ci.corp.ngrok.com

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Format Check 🧹
        run: pnpm run fmt:check

      # Why: type-aware lint walks up past the repo root for a file that no tsconfig owns.
      # An invalid tsconfig above the checkout turns a new orphan file into a lint error.
      - name: Plant an invalid tsconfig above the checkout 🪤
        run: echo '{ invalid' > "${GITHUB_WORKSPACE}/../tsconfig.json"

      # The fixer checks each cache file against the lockfile and the CSS it loads,
      # so a stale restore only costs a recompute.
      - name: Restore Tailwind Canonical Cache 💾
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tailwind-canonical
          key: tailwind-canonical-${{ hashFiles('pnpm-lock.yaml', 'packages/mantle/src/*.css') }}
          restore-keys: tailwind-canonical-

      - name: Tailwind Canonical Classes 🎨
        run: pnpm run tailwind:check

      - name: Lint Check 🔍
        run: pnpm run lint

      - name: Agent Docs Budget 📏
        run: pnpm run check:agent-docs

      - name: Doc Links 🔗
        run: pnpm run check:doc-links

  mise-lock-check:
    name: Mise Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cache mise binary 🗃️
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-${{ runner.os }}-${{ hashFiles('scripts/install-mise') }}

      - name: Install mise 🔧
        run: |
          # Put the cached binary on PATH first so install-mise's version check finds it
          # and skips re-downloading the pinned release on a cache hit.
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/install-mise
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify mise.lock is in sync 🔒
        # mise lock looks up release metadata on api.github.com. The token lifts
        # the anonymous per-IP rate limit shared by the runner pool. mise lock
        # runs the PR's exec helper, so the workflow-level permissions must stay
        # contents: read.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise trust ./mise.toml
          mise lock
          if ! git diff --exit-code mise.lock; then
            echo "::error::mise.lock is out of sync with .nvmrc / package.json#packageManager."
            echo "::error::Run 'mise run relock' locally and commit the result."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Build 🏗️
        run: pnpm run build

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Typecheck 🔎
        run: pnpm run typecheck

  # Happy-dom/unit shards. `@ngrok/mantle` is the only package with browser-mode
  # tests, so each shard runs non-mantle tests normally and then runs Mantle's
  # `unit` Vitest project explicitly. PLAYWRIGHT_WS_ENDPOINT is set to a dummy
  # value so the root //#install:playwright turbo dependency no-ops on this path;
  # browser tests run in the separate `browser-test` job below.
  #
  # Each shard restores the Vitest module cache that `warm-vitest-cache` saves from
  # `main`. Without it, transforms are about two thirds of the www test run.
  test:
    name: test (shard ${{ matrix.shard }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shard_total: [4]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compute Vitest cache key 🔑
        id: vitest-cache-key
        uses: ./.github/actions/vitest-module-cache-key

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        # --trust-lockfile skips the minimumReleaseAge supply-chain re-check on this
        # gate-binding job. static-checks / typecheck / build still run the full
        # frozen install, so lockfile bumps keep getting checked every run.
        run: pnpm install --frozen-lockfile --trust-lockfile

      # Restore after the install, because the cache is in node_modules. Only `warm-vitest-cache`
      # saves, because a cache that a PR run saves is visible only to that PR.
      - name: Restore Vitest module cache 💾
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ steps.vitest-cache-key.outputs.key }}
          restore-keys: ${{ steps.vitest-cache-key.outputs.prefix }}

      - name: Configure test worker limits
        run: |
          WORKERS=$(node -e 'const os = require("node:os"); const cores = os.availableParallelism?.() ?? os.cpus().length ?? 2; console.log(Math.max(1, Math.min(cores, 4)));')
          echo "TURBO_TEST_CONCURRENCY=${WORKERS}" >> "${GITHUB_ENV}"
          echo "Using ${WORKERS} test worker(s) for this runner"

      - name: Test 🧪
        env:
          PLAYWRIGHT_WS_ENDPOINT: skip
        run: |
          non_mantle_status=0
          pnpm exec turbo run test \
            --concurrency="${TURBO_TEST_CONCURRENCY}" \
            --continue=always \
            --filter='!@ngrok/mantle' \
            --filter='!@ngrok/mantle-vite-plugins' \
            -- --shard="${{ matrix.shard }}/${{ matrix.shard_total }}" --maxWorkers="${TURBO_TEST_CONCURRENCY}" || non_mantle_status=$?

          # Why unsharded on shard 1 only: vitest rejects --shard when a package
          # has fewer test files than shard_total, and @ngrok/mantle-vite-plugins
          # has two.
          vite_plugins_status=0
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            pnpm exec turbo run test \
              --concurrency="${TURBO_TEST_CONCURRENCY}" \
              --continue=always \
              --filter='@ngrok/mantle-vite-plugins' \
              -- --maxWorkers="${TURBO_TEST_CONCURRENCY}" || vite_plugins_status=$?
          fi

          mantle_status=0
          pnpm exec turbo run test \
            --concurrency="${TURBO_TEST_CONCURRENCY}" \
            --continue=always \
            --filter='@ngrok/mantle' \
            -- --project=unit --shard="${{ matrix.shard }}/${{ matrix.shard_total }}" --maxWorkers="${TURBO_TEST_CONCURRENCY}" || mantle_status=$?

          echo "non-mantle test status: ${non_mantle_status}"
          echo "mantle-vite-plugins test status: ${vite_plugins_status}"
          echo "mantle unit test status: ${mantle_status}"

          if [[ "${non_mantle_status}" -ne 0 || "${vite_plugins_status}" -ne 0 || "${mantle_status}" -ne 0 ]]; then
            exit 1
          fi

  # Browser-mode tests only. Launches a local headless Chromium from a cached
  # browser build instead of installing Playwright in every unit shard.
  browser-test:
    name: browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Resolve Playwright version 🎭
        id: playwright
        run: |
          version="$(yq -r '.catalog.playwright' pnpm-workspace.yaml)"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "::error::Could not resolve .catalog.playwright from pnpm-workspace.yaml — refusing to cache an invalid Playwright browser build."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore Playwright browser cache 🎭
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key on the Playwright version only, so the cached browser binaries
          # survive unrelated pnpm-workspace.yaml edits and are reused until the
          # next genuine Playwright bump.
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Dependencies 📥
        # See the `test` job for why the gate-binding jobs trust the already-verified
        # lockfile; the other jobs keep the supply-chain re-check.
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Install Playwright Chromium 🎭
        # Why gated on the cache: a hit means the pinned browser build is already
        # restored, and the apt system libraries --with-deps re-applies ship on the
        # ubuntu-latest image. Skipping keeps apt off the hot path: an apt-mirror
        # outage once hung this step for the whole 20-minute job timeout. The step
        # timeout makes a hang on the rare cache-miss path fail fast instead.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm -F @ngrok/mantle exec playwright install --with-deps chromium

      - name: Configure test worker limits
        run: |
          WORKERS=$(node -e 'const os = require("node:os"); const cores = os.availableParallelism?.() ?? os.cpus().length ?? 2; console.log(Math.max(1, Math.min(cores, 4)));')
          echo "TURBO_TEST_CONCURRENCY=${WORKERS}" >> "${GITHUB_ENV}"
          echo "Using ${WORKERS} test worker(s) for this runner"

      # Why: Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and
      # the Chromium sandbox needs them. GitHub discards the runner after the job.
      - name: Allow the Chromium sandbox 🔒
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Browser Test 🧪
        run: |
          pnpm exec turbo run test \
            --concurrency="${TURBO_TEST_CONCURRENCY}" \
            --continue=always \
            --filter='@ngrok/mantle' \
            -- --project='browser*' --maxWorkers="${TURBO_TEST_CONCURRENCY}"

  # GitHub scopes an Actions cache to the ref that saved it, and a PR run reads only its
  # own caches and the caches of `main`. So this job saves the Vitest module cache from
  # `main`. The dated key makes it run the unit suite on the first `main` push of each day,
  # and again after a key input changes. It is not in the `vibe-check` gate.
  warm-vitest-cache:
    name: warm-vitest-cache
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compute Vitest cache key 🔑
        id: vitest-cache-key
        uses: ./.github/actions/vitest-module-cache-key

      - name: Check Vitest module cache 💾
        id: vitest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ steps.vitest-cache-key.outputs.key }}
          lookup-only: true

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        if: steps.vitest-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - if: steps.vitest-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        if: steps.vitest-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --trust-lockfile

      # The env and the Vitest projects match the `test` shards, so the cached modules match
      # their keys. `--cache=local:,remote:` turns off the turbo cache, because a turbo hit runs no Vitest.
      - name: Transform the unit suite 🧪
        id: transform
        if: steps.vitest-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PLAYWRIGHT_WS_ENDPOINT: skip
        run: |
          pnpm exec turbo run test --cache=local:,remote: --continue=always --output-logs=errors-only \
            --filter='!@ngrok/mantle'
          pnpm exec turbo run test --cache=local:,remote: --continue=always --output-logs=errors-only \
            --filter='@ngrok/mantle' -- --project=unit

      # Save only after a clean run, because a crash or a failed test can leave a partial cache.
      # The job stays green on a failure, because the `test` shards already test this commit.
      - name: Save Vitest module cache 💾
        if: steps.vitest-cache.outputs.cache-hit != 'true' && steps.transform.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ steps.vitest-cache-key.outputs.key }}

  vibe-check:
    name: vibe-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - static-checks
      - mise-lock-check
      - build
      - typecheck
      - test
      - browser-test
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify all vibe check jobs passed
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          MISE_LOCK_CHECK_RESULT: ${{ needs.mise-lock-check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_TEST_RESULT: ${{ needs.browser-test.result }}
        run: |
          echo "static-checks: $STATIC_CHECKS_RESULT"
          echo "mise-lock-check: $MISE_LOCK_CHECK_RESULT"
          echo "build: $BUILD_RESULT"
          echo "typecheck: $TYPECHECK_RESULT"
          echo "test: $TEST_RESULT"
          echo "browser-test: $BROWSER_TEST_RESULT"

          if [[ "$STATIC_CHECKS_RESULT" != "success" || \
                "$MISE_LOCK_CHECK_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" || \
                "$TYPECHECK_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BROWSER_TEST_RESULT" != "success" ]]; then
            echo "One or more vibe check jobs did not succeed."
            exit 1
          fi
