name: Screen Reader Check

# Report only: no job here fails the build. Each job runs the flows in
# apps/www/screen-reader/flows.ts on the docs previews and writes what the
# reader said to the job summary and an artifact.
#
# - `virtual` runs on each PR that touches a component, the docs site, or a
#   dependency. It uses Guidepup's virtual reader plus Chromium's accessibility
#   tree, about 4 minutes on ubuntu-latest.
# - `real` drives NVDA (Windows, Chromium) and VoiceOver (macOS, WebKit) on the
#   PR head and on the last release, and diffs them. A Linux job builds both
#   docs sites for them. It runs on the weekly
#   schedule, on a manual run, and on a PR with the `screen-reader` label.
#
# Why `continue-on-error` on each step that can fail, not on the job: a failed
# job shows a red check on the PR even when the job may fail.
# To make a job blocking later, remove `continue-on-error` from its steps and
# pass `--strict` to report.ts. With `--base`, it exits 1 only on an
# expectation that the base run met.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/mantle/src/**"
      - "apps/www/app/**"
      - "apps/www/screen-reader/**"
      - ".github/workflows/screen-reader.yml"
      - "packages/mantle/package.json"
      - "apps/www/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: "Ref to compare against (default: the last @ngrok/mantle release tag)"
        required: false

# Why the run ID for other labels: a label that is not `screen-reader` must not
# cancel a real-reader run in progress. Those runs skip every job.
concurrency:
  group: screen-reader-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'screen-reader' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  virtual:
    if: github.event.action != 'labeled' || github.event.label.name == 'screen-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium 🎭
        continue-on-error: true
        run: pnpm -F @app/www exec playwright install --with-deps chromium

      - name: Build the docs site 🏗️
        continue-on-error: true
        run: pnpm exec turbo run build --filter=@app/www

      - name: Run the flows 🗣️
        continue-on-error: true
        working-directory: apps/www
        run: |
          PORT=4001 NODE_ENV=production pnpm exec app-server serve > /tmp/serve.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:4001/robots.txt && break; sleep 1; done
          node screen-reader/run.ts --reader=virtual --base=http://localhost:4001/ --out=/tmp/virtual.json
          node screen-reader/report.ts --head=/tmp/virtual.json --base=screen-reader/baseline.virtual.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results 📤
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screen-reader-virtual
          path: /tmp/virtual.json

  # Why a Linux build for the real readers: the package scripts are POSIX shell, so the
  # docs site does not build on Windows. The readers serve these builds.
  build:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'screen-reader') &&
      (github.event.action != 'labeled' || github.event.label.name == 'screen-reader'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      base: ${{ steps.base.outputs.ref }}
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the base ref 🏷️
        id: base
        continue-on-error: true
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          base="${INPUT_BASE:-$(git tag --list '@ngrok/mantle@*' --sort=-v:refname | head -n 1)}"
          git worktree add base -- "$base"
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Build both docs sites 🏗️
        id: build
        if: steps.base.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@app/www
          cd base
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@app/www

      - name: Upload the builds 📤
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-builds
          path: |
            apps/www/build
            packages/*/dist
            base/apps/www/build
            base/packages/*/dist

  real:
    needs: build
    if: needs.build.outputs.built == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - reader: nvda
            os: windows-2025
          - reader: voiceover
            os: macos-15
    runs-on: ${{ matrix.os }}
    # Why 90: VoiceOver on macos-15 takes about 40 minutes for both runs.
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base 🏷️
        continue-on-error: true
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: git worktree add base -- "$BASE"

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      # Why --ignore-scripts: the install scripts are POSIX shell, and the builds come from Linux.
      - name: Install Dependencies 📥
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          (cd base && pnpm install --frozen-lockfile --ignore-scripts)

      - name: Download the builds 📥
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-builds

      - name: Set up the screen reader 🔧
        continue-on-error: true
        working-directory: apps/www
        run: |
          npx -y @guidepup/setup@0.29.3 setup --ci
          npx -y @guidepup/setup@0.29.3 install
          pnpm exec playwright install ${{ matrix.reader == 'voiceover' && 'webkit' || 'chromium' }}

      - name: Run the flows 🗣️
        continue-on-error: true
        working-directory: apps/www
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: |
          (PORT=4001 NODE_ENV=production pnpm exec app-server serve > "$GITHUB_WORKSPACE/serve-head.log" 2>&1 &)
          (cd ../../base/apps/www && PORT=4002 NODE_ENV=production pnpm exec app-server serve > "$GITHUB_WORKSPACE/serve-base.log" 2>&1 &)
          for port in 4001 4002; do
            for i in $(seq 90); do curl -sf -o /dev/null "http://localhost:$port/robots.txt" && break; sleep 1; done
          done
          node screen-reader/run.ts --reader=${{ matrix.reader }} --base=http://localhost:4002/ --out=../../${{ matrix.reader }}-base.json
          node screen-reader/run.ts --reader=${{ matrix.reader }} --base=http://localhost:4001/ --out=../../${{ matrix.reader }}-head.json
          echo "Base: $BASE" >> "$GITHUB_STEP_SUMMARY"
          node screen-reader/report.ts --head=../../${{ matrix.reader }}-head.json --base=../../${{ matrix.reader }}-base.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results 📤
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screen-reader-${{ matrix.reader }}
          path: |
            ${{ matrix.reader }}-*.json
            serve-*.log
